name: Device builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build:app
        working-directory: web
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m unittest discover -s desktop/tests -v
      - run: .\desktop\build.ps1
      - name: Create setup installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" desktop\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-download
          path: dist/StudentSurveyCreator-Windows.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-setup
          path: dist/StudentSurveyCreator-Setup.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org org.agal --project-name agal_research .
        working-directory: mobile
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze --no-fatal-infos
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: Android-development-APK
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  website:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: Windows-download
          path: web/public/releases
      - uses: actions/download-artifact@v4
        with:
          name: Android-development-APK
          path: web/public/releases
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          REQUIRE_DOWNLOADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: Website-with-downloads
          path: web/dist
          if-no-files-found: error
