name: Hosted PostgreSQL checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: survey_test
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: survey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U survey_test -d survey_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://survey_test:integration-test-only@127.0.0.1:5432/survey_test
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m unittest discover -s backend/postgres_tests -v
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build:vercel
        working-directory: web
      - run: npm run test:site
        working-directory: web
      - run: npm run test:hosted
        working-directory: web
      - run: npm run build:app
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
